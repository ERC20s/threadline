<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>payments-widget.js — browser test</title>
  <style>
    body{font-family:system-ui,Arial,sans-serif;padding:18px}
    .ok{color:#059669}
    .fail{color:#b91c1c}
    .case{margin:8px 0}
    #fixtures{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
    #fixtures > div{border:1px dashed #e5e7eb;padding:10px;min-height:80px}
  </style>
</head>
<body>
  <h1>payments-widget.js — browser-run test page</h1>
  <div id="results"></div>
  <div id="fixtures">
    <div>
      <h3>Default group (d8aaaa-batch_threadline)</h3>
      <!-- default group: no data-d8a-group attr — must resolve to the GROUP
           constant in payments-widget.js, i.e. the slug declared in .d8a -->
      <div id="group-store"></div>
    </div>
    <div>
      <h3>Explicit same group (d8aaaa-batch_threadline)</h3>
      <!-- duplicate id intentionally to exercise multi-container handling -->
      <div id="group-store" data-d8a-group="d8aaaa-batch_threadline"></div>
    </div>
    <div>
      <h3>Different group (other-group)</h3>
      <div id="group-store" data-d8a-group="other-group"></div>
    </div>
    <div>
      <h3>Retry group (retry-group)</h3>
      <form onsubmit="window._submitted = true; return false;">
        <div id="group-store" data-d8a-group="retry-group"></div>
      </form>
    </div>
    <div>
      <h3>Checkout fixture (checkout-group)</h3>
      <!-- Dedicated fixture for the checkout test: avoids adding another #group-store id -->
      <div id="group-store-checkout" data-d8a-group="checkout-group"></div>
    </div>
    <div>
      <h3>Checkout duplicate container (checkout-group)</h3>
      <!-- Second container resolving to the same checkout-group to exercise cross-container deduplication -->
      <div id="group-store" data-d8a-group="checkout-group"></div>
    </div>
    <div>
      <h3>Slow render (intent-group)</h3>
      <!-- The items response for intent-group is deliberately delayed so a Buy
           intent can be queued while the panel is still empty — the race
           scripts/checkout-intent.js exists to fix. Not an id="group-store"
           duplicate of the checkout fixtures: the widget finds it by id too, so
           it uses the shared #group-store id. -->
      <div id="group-store" data-d8a-group="intent-group"></div>
    </div>
  </div>

  <script>
  // Simple test harness
  var resultsEl = document.getElementById('results');
  function note(name, ok, msg) {
    var d = document.createElement('div'); d.className = 'case';
    var s = document.createElement('span'); s.textContent = (ok ? 'PASS' : 'FAIL') + ' — ' + name + ': ';
    s.className = ok ? 'ok' : 'fail';
    d.appendChild(s);
    var m = document.createElement('span'); m.textContent = ' ' + (msg || ''); d.appendChild(m);
    resultsEl.appendChild(d);
    console[name==='final' ? (ok? 'log':'error') : (ok ? 'log' : 'error')](name, msg || '');
  }

  // Mock fetch to control network responses and count requests.
  (function () {
    var BASE = 'https://d8a.com';
    window.__testFetchCounts = {};

    // Checkout-count helpers exposed for tests
    window.__testCheckoutCount = 0;
    window.__testCheckoutByGroup = {};
    window.__testCheckoutSeen = new Promise(function (resolve) { window.__resolveTestCheckoutSeen = resolve; });

    // Stateful behavior: retry-group first call fails, second call succeeds.
    var callState = { 'retry-group': 0 };

    function jsonResponse(obj, ok) {
      return Promise.resolve({ ok: !!ok, status: ok?200:500, json: function(){ return Promise.resolve(obj); } });
    }

    window.fetch = function (url, opts) {
      // count
      try {
        var m = url.match(/[?&]group=([^&]+)/);
        var g = m ? decodeURIComponent(m[1]) : null;
        if (url.indexOf('/api/v1/store/items') !== -1 && g) {
          window.__testFetchCounts[g] = (window.__testFetchCounts[g] || 0) + 1;
        }
      } catch (e) {}

      // items endpoint
      if (url.indexOf('/api/v1/store/items') !== -1) {
        var g = (url.match(/[?&]group=([^&]+)/) || [])[1] || '';
        g = decodeURIComponent(g);
        // retry-group: first call fails (network reject), second call succeeds
        if (g === 'retry-group') {
          callState['retry-group']++; if (callState['retry-group'] === 1) return Promise.reject(new Error('network'));
          return jsonResponse({ items: [ { id: 'r1', name: 'Retry Tee', price: '$10', payUrl: 'https://d8a.com/pay/r1' } ], group: { name: 'Retry', url: 'https://d8a.com/g/retry-group' }, checkout: { enabled: false } }, true);
        }

        // d8aaaa-batch_threadline (the real group slug): return a payload with one unsafe payUrl
        if (g === 'd8aaaa-batch_threadline') {
          return jsonResponse({ items: [ { id: 'item-unsafe', name: 'Bad Link Tee', description: 'edge payUrl', price: '$12', payUrl: 'javascript:alert(1)' } ], group: { name: 'Threadline', url: 'https://d8a.com/g/d8aaaa-batch_threadline' }, checkout: { enabled: false } }, true);
        }

        // other-group: empty list
        if (g === 'other-group') {
          return jsonResponse({ items: [], group: { name: 'Other', url: 'https://d8a.com/g/other-group' }, checkout: { enabled: false } }, true);
        }

        // intent-group: same shape as checkout-group but the answer arrives late,
        // so the container is still empty when the Buy intent is queued.
        if (g === 'intent-group') {
          return new Promise(function (resolve) {
            setTimeout(function () {
              resolve({ ok: true, status: 200, json: function () {
                return Promise.resolve({ items: [ { id: 'i1', name: 'Everyday Tee', price: '$38', payUrl: 'https://d8a.com/pay/i1' } ], group: { name: 'Intent', url: 'https://d8a.com/g/intent-group' }, checkout: { enabled: true, url: 'https://d8a.com/api/v1/store/checkout' } });
              } });
            }, 900);
          });
        }

        // checkout-group: provide an item and enable checkout so Buy triggers a POST
        if (g === 'checkout-group') {
          return jsonResponse({ items: [ { id: 'c1', name: 'Checkout Tee', price: '$15', payUrl: 'https://d8a.com/pay/c1' } ], group: { name: 'Checkout', url: 'https://d8a.com/g/checkout-group' }, checkout: { enabled: true, url: 'https://d8a.com/api/v1/store/checkout' } }, true);
        }

        // default fallback
        return jsonResponse({ items: [], group: { name: g, url: BASE + '/g/' + g }, checkout: { enabled: false } }, true);
      }

      // orders endpoint: verify order
      if (url.indexOf('/api/v1/store/orders/') !== -1) {
        var oid = (url.match(/\/api\/v1\/store\/orders\/([^?]+)/) || [])[1] || '';
        oid = decodeURIComponent(oid);
        // We accept 'paid-1' as a paid order for d8aaaa-batch_threadline
        if (oid === 'paid-1') {
          return jsonResponse({ paid: true, order: { id: 'paid-1', itemName: 'T-Shirt', quantity: 1 } }, true);
        }
        return jsonResponse({ paid: false }, true);
      }

      // checkout endpoint: count POSTs by endpoint+method (and by the group in
      // the posted body, so fixtures cannot contaminate each other's counts).
      if (url.indexOf('/api/v1/store/checkout') !== -1) {
        try {
          var method = opts && opts.method ? String(opts.method).toUpperCase() : 'GET';
          if (method === 'POST') {
            var bodyGroup = null;
            try { bodyGroup = JSON.parse(opts.body).group; } catch (e) {}
            if (bodyGroup) {
              window.__testCheckoutByGroup[bodyGroup] = (window.__testCheckoutByGroup[bodyGroup] || 0) + 1;
            }
            window.__testCheckoutCount = (window.__testCheckoutCount || 0) + 1;
            if (typeof window.__resolveTestCheckoutSeen === 'function') {
              try { window.__resolveTestCheckoutSeen(window.__testCheckoutCount); } catch (e) {}
              // only resolve once
              window.__resolveTestCheckoutSeen = null;
            }
          }
        } catch (e) {}
        // Deliberately never settles: the widget sets location.href from the
        // checkout answer, which would navigate the test page away before the
        // results could be read. The POST has already been counted above.
        return new Promise(function () {});
      }

      // anything else: passthrough to real fetch if available
      if (typeof window.__origFetch === 'function') return window.__origFetch(url, opts);
      return Promise.reject(new Error('unmocked'));
    };
  })();
  </script>

  <!-- Paths are relative to the repository root: open this page from the root
       (e.g. the `site` entry in .d8a) so both scripts resolve. -->
  <script src="../scripts/checkout-intent.js"></script>
  <script src="../payments-widget.js"></script>

  <script>
  // Run assertions after a short delay to allow the widget to initialize.
  function runChecks() {
    try {
      // 1) Shared in-memory cache used for same group: d8aaaa-batch_threadline
      // This also pins the default group: the container with no data-d8a-group
      // must resolve to the slug declared in .d8a, so both fixtures share one fetch.
      var counts = window.__testFetchCounts || {};
      var sharedOk = (counts['d8aaaa-batch_threadline'] === 1);
      note('shared-cache-used', sharedOk, 'items fetch count for d8aaaa-batch_threadline = ' + (counts['d8aaaa-batch_threadline']||0));

      // 2) Safe href fallback for unsafe payUrl: item-unsafe should have href https://d8a.com/g/d8aaaa-batch_threadline
      var anchors = Array.prototype.slice.call(document.querySelectorAll('#group-store a[data-item="item-unsafe"]'));
      var a = anchors.length ? anchors[0] : null;
      var hrefOk = !!a && a.getAttribute('href') === 'https://d8a.com/g/d8aaaa-batch_threadline';
      note('safe-href-fallback', hrefOk, a ? ('href=' + a.getAttribute('href')) : 'anchor not found');

      // 3) groupStoreVerify resolves to paid order when orders endpoint returns paid
      if (typeof window.groupStoreVerify === 'function') {
        window.groupStoreVerify('paid-1').then(function (o) {
          var ok = o && o.id === 'paid-1' && o._d8a_group === 'd8aaaa-batch_threadline';
          note('groupStoreVerify-paid', ok, ok ? ('id='+o.id+', group='+o._d8a_group) : JSON.stringify(o));
        }).catch(function (e) { note('groupStoreVerify-paid', false, String(e)); });
      } else {
        note('groupStoreVerify-paid', false, 'groupStoreVerify not found');
      }

      // 4) Retry control: retry-group should show Retry button, clicking it should trigger a second network attempt and render items
      var retryContainer = document.querySelector('#fixtures div [data-d8a-group="retry-group"]') || document.querySelector('#fixtures [data-d8a-group="retry-group"]') || document.querySelector('[data-d8a-group="retry-group"]');

      setTimeout(function(){
        var btn = retryContainer && retryContainer.querySelector('[data-d8a-retry]');
        var hadBtn = !!btn;
        note('retry-button-present', hadBtn, hadBtn ? 'found retry button' : 'no retry button');
        if (!btn) return;
        var before = (window.__testFetchCounts && window.__testFetchCounts['retry-group']) || 0;
        btn.click();
        // wait for retry to finish
        setTimeout(function(){
          var after = (window.__testFetchCounts && window.__testFetchCounts['retry-group']) || 0;
          var increased = after > before;
          var hasItem = !!retryContainer.querySelector('a[data-item="r1"]');
          note('retry-clears-cache-and-retries', increased && hasItem, 'requests before=' + before + ' after=' + after + ' hasItem=' + hasItem);
          // New assertion: clicking Retry should not submit an enclosing form
          var notSubmitted = (window._submitted !== true);
          note('retry-does-not-submit-outer-form', notSubmitted, 'window._submitted=' + String(window._submitted));
        }, 600);
      }, 200);

      // 5) Prevent duplicate checkout POSTs when Buy is clicked twice quickly across two containers that resolve to the same group
      // Find Buy anchors inside containers for checkout-group and click across them.
      function runCheckoutDupTest() {
        var anchors = Array.prototype.slice.call(document.querySelectorAll('#fixtures [data-d8a-group="checkout-group"] a[data-item]'));
        // If we have two distinct anchors in two containers, click them once each to simulate concurrent clicks across containers.
        if (anchors.length >= 2) {
          try { anchors[0].click(); } catch (e) {}
          try { anchors[1].click(); } catch (e) {}
        } else {
          // Fallback: use the dedicated checkout fixture and click twice rapidly on the same anchor.
          var anchor = document.querySelector('#group-store-checkout a[data-item]') || document.querySelector('[data-d8a-group="checkout-group"] a[data-item]');
          if (!anchor) {
            setTimeout(function() { runCheckoutDupTest(); }, 300);
            return;
          }
          try { anchor.click(); anchor.click(); } catch (e) {}
        }

        // Wait up to 2000ms for the mocked checkout POST to be observed.
        var seenPromise = window.__testCheckoutSeen || Promise.resolve(null);
        var timeout = new Promise(function (resolve) { setTimeout(function () { resolve('timeout'); }, 2000); });
        Promise.race([seenPromise, timeout]).then(function (res) {
          var count = (window.__testCheckoutByGroup && window.__testCheckoutByGroup['checkout-group']) || 0;
          // ensure at least one of the anchors is still present in the DOM
          var stillInDOM = !!(document.querySelector('#group-store-checkout a[data-item]') || document.querySelectorAll('#fixtures [data-d8a-group="checkout-group"] a[data-item]').length);
          var ok = (count === 1) && stillInDOM;
          note('prevent-duplicate-checkout', ok, 'checkout POSTs=' + count + ' anchorPresent=' + stillInDOM + ' waited=' + String(res));
        }).catch(function (e) {
          var count = (window.__testCheckoutByGroup && window.__testCheckoutByGroup['checkout-group']) || 0;
          var stillInDOM = !!(document.querySelector('#group-store-checkout a[data-item]') || document.querySelectorAll('#fixtures [data-d8a-group="checkout-group"] a[data-item]').length);
          note('prevent-duplicate-checkout', false, 'error waiting for checkout count: ' + String(e) + ' count=' + count + ' anchorPresent=' + stillInDOM);
        });
      }

      // Kick off the checkout test after a short delay to allow item rendering.
      setTimeout(runCheckoutDupTest, 500);

      // 6) Queued Buy intent: the intent-group items answer is delayed, so the
      // container is still empty here. Threadline.whenBuyAnchor must wait for
      // the anchor instead of failing, and clicking the resolved anchor must
      // produce exactly one checkout POST for that group.
      (function runQueuedIntentTest() {
        var container = document.querySelector('[data-d8a-group="intent-group"]');
        if (!container || !window.Threadline || typeof window.Threadline.whenBuyAnchor !== 'function') {
          note('queued-buy-intent', false, 'container or Threadline.whenBuyAnchor missing');
          return;
        }

        // Precondition: nothing to click yet — this is the early-click race.
        var emptyAtQueueTime = !container.querySelector('a[data-item]');
        note('intent-panel-empty-when-queued', emptyAtQueueTime, emptyAtQueueTime ? 'no Buy anchor rendered yet' : 'anchor already present — test is not exercising the race');

        // Count clicks on Buy anchors inside this container.
        var clicks = 0;
        container.addEventListener('click', function (e) {
          var a = e.target && e.target.closest ? e.target.closest('a[data-item]') : null;
          if (a) clicks++;
        }, true);

        var matchFn = function (a) { return a.getAttribute('data-item') === 'i1'; };

        window.Threadline.whenBuyAnchor(container, matchFn, 3000).then(function (anchor) {
          anchor.click();
          setTimeout(function () {
            var posts = (window.__testCheckoutByGroup && window.__testCheckoutByGroup['intent-group']) || 0;
            var ok = !!anchor && anchor.getAttribute('data-item') === 'i1' && clicks === 1 && posts === 1;
            note('queued-buy-intent', ok, 'resolved item=' + anchor.getAttribute('data-item') + ' clicks=' + clicks + ' checkout POSTs=' + posts);
          }, 250);
        }).catch(function (err) {
          note('queued-buy-intent', false, 'whenBuyAnchor rejected: ' + String(err && err.message ? err.message : err));
        });
      })();

      // 7) Live price and "listed, but not this piece": what product.html reads
      // before anyone clicks Buy. Uses the already-rendered checkout fixture
      // (item c1, price "$15") — read only, no clicks, so it cannot disturb the
      // duplicate-checkout counts above.
      setTimeout(function runShopPriceTest(attempt) {
        var T = window.Threadline;
        var container = document.getElementById('group-store-checkout');
        var anchor = container && container.querySelector('a[data-item="c1"]');

        if (!anchor && (attempt || 0) < 8) {
          setTimeout(function () { runShopPriceTest((attempt || 0) + 1); }, 200);
          return;
        }
        if (!T || typeof T.buyRowPrice !== 'function') {
          note('buy-row-price', false, 'Threadline.buyRowPrice missing');
          return;
        }
        if (!anchor) {
          note('buy-row-price', false, 'checkout fixture rendered no Buy anchor');
          return;
        }

        var price = T.buyRowPrice(anchor);
        note('buy-row-price', price === '$15', 'buyRowPrice=' + JSON.stringify(price) + ' (expected "$15")');
        note('buy-row-price-no-anchor', T.buyRowPrice(null) === '', 'buyRowPrice(null)=' + JSON.stringify(T.buyRowPrice(null)));

        // Rows rendered (findBuyAnchor with no matchFn) but no row for the piece
        // we are showing: product.html must disable Buy and say so immediately
        // instead of queueing a click that can only time out.
        var anyRow = T.findBuyAnchor(container);
        var mine = T.findBuyAnchor(container, function (a) {
          return a.getAttribute('data-item') === 'not-sold-here';
        });
        var ok = !!anyRow && mine === null;
        note('panel-listed-but-not-this-piece', ok,
          'anyRow=' + (anyRow ? anyRow.getAttribute('data-item') : 'none') + ' matching=' + (mine ? mine.getAttribute('data-item') : 'null'));
      }, 700);

      // 8) shopPriceIndex + samePrice: what products.html repaints its grid
      // from. Read-only over the same checkout fixture (item c1, "Checkout
      // Tee", "$15"), so it cannot disturb the checkout counts above.
      setTimeout(function runShopIndexTest(attempt) {
        var T = window.Threadline;
        var container = document.getElementById('group-store-checkout');
        var anchor = container && container.querySelector('a[data-item="c1"]');

        if (!anchor && (attempt || 0) < 8) {
          setTimeout(function () { runShopIndexTest((attempt || 0) + 1); }, 200);
          return;
        }
        if (!T || typeof T.shopPriceIndex !== 'function' || typeof T.samePrice !== 'function') {
          note('shop-price-index', false, 'Threadline.shopPriceIndex/samePrice missing');
          return;
        }
        if (!anchor) {
          note('shop-price-index', false, 'checkout fixture rendered no Buy anchor');
          return;
        }

        var index = T.shopPriceIndex(container);

        // Matched by platform item id, and by the row title the widget renders
        // as <b> — the two keys a catalogue card is looked up with.
        var byId = index.lookup('c1', 'Something Else');
        var byName = index.lookup('no-such-id', 'checkout tee');
        var matchedOk = index.size === 1 &&
          !!byId && byId.price === '$15' &&
          !!byName && byName.anchor === anchor &&
          index.priceFor('c1') === '$15';
        note('shop-price-index-matches', matchedOk,
          'size=' + index.size + ' byId=' + (byId ? byId.price : 'null') +
          ' byName=' + (byName ? byName.name : 'null'));

        // A catalogue piece the shop has no row for: products.html flags the
        // card "Not in the shop yet" instead of advertising a price.
        var missing = index.lookup('everyday-tee', 'Everyday Tee');
        note('shop-price-index-unlisted', missing === null && index.priceFor('everyday-tee', 'Everyday Tee') === '',
          'lookup(everyday-tee)=' + String(missing) + ' priceFor=' + JSON.stringify(index.priceFor('everyday-tee', 'Everyday Tee')));

        // An empty container must read as "the shop said nothing" (size 0), not
        // as "nothing is on sale".
        var emptyIndex = T.shopPriceIndex(document.createElement('div'));
        note('shop-price-index-empty-panel', emptyIndex.size === 0 && emptyIndex.lookup('c1') === null,
          'size=' + emptyIndex.size);

        // samePrice tolerance: same money in different shapes is not a repaint;
        // a different number or a different currency mark is.
        var tolerant = T.samePrice('$15', '15.00') && T.samePrice('$38', '$38') &&
          T.samePrice(' $38 ', '$38.00') && T.samePrice('38', '38.0');
        var strict = !T.samePrice('$15', '$18') && !T.samePrice('$15', '€15') &&
          !T.samePrice('$15', '') && !T.samePrice('', 'free');
        note('same-price-tolerance', tolerant && strict,
          'tolerant=' + tolerant + ' strict=' + strict);
      }, 750);

      // Final aggregator after a bit more time
      setTimeout(function(){
        note('final', true, 'Manual-run tests completed; review individual PASS/FAIL lines above.');
      }, 2800);

    } catch (e) { note('runChecks', false, String(e)); }
  }

  // Kick off checks once a short time after load.
  setTimeout(runChecks, 400);
  </script>
</body>
</html>
