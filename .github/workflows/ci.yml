name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium

      # Serves the site as the `site` run entry in .d8a does, runs every
      # tests/*.test.html page headlessly, then the Playwright flows
      # (tests/*.flow.js: the smoke walk, checkout, SEO/performance); exits
      # non-zero on any FAIL.
      - run: npm test
