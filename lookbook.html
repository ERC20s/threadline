<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Threadline — Lookbook</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1 class="brand">Threadline</h1>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="product.html">Product</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="wrap main-content">
    <h2 class="page-title">Lookbook</h2>
    <p class="lead">A visual showcase of the collection. Images are inline SVG placeholders to keep the site lightweight.</p>

    <section class="gallery" aria-label="Lookbook gallery">
      <!-- repeat a set of cards with inline SVG placeholders -->
      <figure class="card">
        <a href="product.html" class="card-link">
          <svg role="img" aria-labelledby="p1-title" viewBox="0 0 600 400" class="placeholder">
            <title id="p1-title">Model wearing striped shirt</title>
            <rect width="100%" height="100%" fill="#eaeaea"></rect>
            <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#999" font-family="sans-serif" font-size="24">Image 1</text>
          </svg>
          <figcaption class="caption">Striped Shirt — Summer '26</figcaption>
        </a>
      </figure>

      <figure class="card">
        <a href="product.html" class="card-link">
          <svg role="img" aria-labelledby="p2-title" viewBox="0 0 600 400" class="placeholder">
            <title id="p2-title">Model wearing jacket</title>
            <rect width="100%" height="100%" fill="#efecec"></rect>
            <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#888" font-family="sans-serif" font-size="24">Image 2</text>
          </svg>
          <figcaption class="caption">Light Jacket — Autumn Drop</figcaption>
        </a>
      </figure>

      <figure class="card">
        <a href="product.html" class="card-link">

        </a>
      </figure>

      <figure class="card">
