<!--
  Threadline shared header/nav partial.
  This is plain, documented HTML (no templating engine exists yet), meant to
  be copy-pasted verbatim into the <body> of every page, right after the
  opening <body> tag. Each page must:
    1. Link styles.css (adjust the relative path as needed) in <head>.
    2. Add aria-current="page" to the .site-nav__link that matches the
       current page, and remove it from the others.
  Requires no JavaScript framework: a single inline script toggles the
  ".is-open" class on the nav for small screens.
-->
<header class="site-header">
  <div class="container flex flex--between">
    <a class="site-header__wordmark" href="index.html">Threadline</a>

    <button
      class="nav-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="site-nav"
      onclick="var nav=document.getElementById('site-nav');var open=nav.classList.toggle('is-open');this.setAttribute('aria-expanded', open);"
    >
      <span class="visually-hidden">Menu</span>
      <span class="nav-toggle__bar"></span>
    </button>

    <nav id="site-nav" class="site-nav" aria-label="Primary">
      <a class="site-nav__link" href="index.html">Shop</a>
      <a class="site-nav__link" href="lookbook.html">Lookbook</a>
      <a class="site-nav__link" href="about.html">About</a>
      <a class="site-nav__link" href="size-guide.html">Size Guide</a>
      <a class="site-nav__link" href="contact.html">Contact</a>
    </nav>
  </div>
</header>
