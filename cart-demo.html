<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cart UI Demo</title>
  <link rel="stylesheet" href="styles/main.css">
  <!-- The brand mark, inline so the site never asks for a file that is not
       in the repository (every page used to log a 404 for /favicon.ico). -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237c5cff'/%3E%3Cpath d='M8 10.5h16M16 10.5v13' stroke='%23fff' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles/cart-ui.css">
</head>
<body>
  <main style="padding:24px">
    <h1>Cart UI Demo</h1>
    <p>This page demonstrates the non-invasive, idempotent ThreadlineCartUI module. It renders into a known container so repeated calls do not rewire the document.</p>

    <div id="cart-demo-root" style="margin:18px 0"></div>

    <p>
      <button id="render-once">Render cart into #cart-demo-root</button>
      <button id="render-again">Call renderInto repeatedly</button>
      <button id="dispatch-add">Dispatch add-to-cart (quantity 1)</button>
    </p>

    <p>Open the console to see events. Repeated calls should not create duplicate badges or handlers.</p>
  </main>

  <script src="scripts/cart-ui.js"></script>
  <script>
    (function () {
      var btnOnce = document.getElementById('render-once');
      if (btnOnce) {
        btnOnce.addEventListener('click', function () {
          var ui = window.ThreadlineCartUI;
          if (ui && typeof ui.renderInto === 'function') {
            ui.renderInto('cart-demo-root');
          } else {
            console.warn('ThreadlineCartUI.renderInto is not available');
          }
        });
      }

      var btnAgain = document.getElementById('render-again');
      if (btnAgain) {
        btnAgain.addEventListener('click', function () {
          var ui = window.ThreadlineCartUI;
          if (ui && typeof ui.renderInto === 'function') {
            // call multiple times to ensure idempotency
            ui.renderInto('cart-demo-root');
            ui.renderInto('cart-demo-root');
            ui.renderInto('cart-demo-root');
          } else {
            console.warn('ThreadlineCartUI.renderInto is not available');
          }
        });
      }

      var btnDispatch = document.getElementById('dispatch-add');
      if (btnDispatch) {
        btnDispatch.addEventListener('click', function () {
          if (typeof document.dispatchEvent === 'function') {
            document.dispatchEvent(new CustomEvent('threadline:add-to-cart', { detail: { quantity: 1 } }));
          } else {
            console.warn('document.dispatchEvent is not available');
          }
        });
      }

      // log cart-updated events
      if (typeof document.addEventListener === 'function') {
        document.addEventListener('threadline:cart-updated', function (ev) {
          console.log('cart-updated', ev.detail);
        });
      }
    })();
  </script>
</body>
</html>
